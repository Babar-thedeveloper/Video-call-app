name: Deploy Video Call App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "SERVER_USER missing" && exit 1; fi
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "SERVER_HOST missing" && exit 1; fi
          if [ -z "${{ secrets.SERVER_PATH }}" ]; then echo "SERVER_PATH missing" && exit 1; fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then echo "SERVER_SSH_KEY missing" && exit 1; fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            set -e

            echo " Go to project"
            cd ${{ secrets.SERVER_PATH }}

            echo " Pull latest code"
            git pull origin main

            echo " Backend"
            cd server
            npm install
            pm2 restart videocall-backend || pm2 start index.js --name videocall-backend

            echo " Frontend"
            cd ../client
            npm install
            npm run build

            echo " Deployment finished"
          EOF
